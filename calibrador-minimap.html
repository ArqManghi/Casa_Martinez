<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calibrador de Minimap — Casa Martínez</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400&family=Outfit:wght@200;300;400&display=swap" rel="stylesheet">
  <style>
    :root {
      --gold: #c8a96e;
      --gold-dim: rgba(200,169,110,0.2);
      --gold-border: rgba(200,169,110,0.3);
      --bg: #080808;
      --text: #f0ece4;
      --text-dim: rgba(240,236,228,0.5);
      --border: rgba(200,169,110,0.25);
      --panel: rgba(10,10,10,0.97);
    }
    * { margin:0; padding:0; box-sizing:border-box; }
    body { font-family:'Outfit',sans-serif; background:var(--bg); color:var(--text); height:100vh; overflow:hidden; display:flex; flex-direction:column; }

    /* ── TOOLBAR ── */
    #toolbar {
      background: rgba(8,8,8,0.98);
      border-bottom: 1px solid var(--border);
      padding: 10px 20px;
      display: flex;
      align-items: center;
      gap: 16px;
      flex-shrink: 0;
      flex-wrap: wrap;
    }
    #toolbar h1 {
      font-family:'Cormorant Garamond',serif;
      font-size: 18px; font-weight: 300;
      letter-spacing: 3px; color: var(--gold);
      white-space: nowrap;
    }
    .tb-sep { width:1px; height:28px; background:var(--border); flex-shrink:0; }
    #scene-select {
      background: rgba(255,255,255,0.04);
      border: 1px solid var(--border); border-radius: 3px;
      color: var(--text); font-family:'Outfit',sans-serif;
      font-size: 12px; letter-spacing: 1px;
      padding: 6px 12px; cursor: pointer; outline: none;
    }
    #scene-select option { background:#111; }
    .tb-btn {
      background: rgba(200,169,110,0.08);
      border: 1px solid var(--border); border-radius: 3px;
      color: var(--gold); font-family:'Outfit',sans-serif;
      font-size: 11px; letter-spacing: 1.5px; text-transform: uppercase;
      padding: 6px 14px; cursor: pointer; transition: all 0.2s; white-space: nowrap;
    }
    .tb-btn:hover { background: rgba(200,169,110,0.16); border-color: var(--gold); }
    #tb-instruccion {
      font-size: 11px; letter-spacing: 1px;
      color: var(--text-dim); margin-left: auto; white-space: nowrap;
    }
    #tb-instruccion strong { color: var(--gold); }

    /* ── MAIN ── */
    #main { display:flex; flex:1; overflow:hidden; }

    /* ── PLANO ── */
    #plano-wrap {
      flex: 1;
      position: relative;
      overflow: hidden;
      background: #0d0d0d;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    #plano-inner {
      position: relative;
      display: inline-block;
      cursor: crosshair;
      user-select: none;
    }
    #plano-img {
      display: block;
      max-width: 100%;
      max-height: calc(100vh - 54px);
      opacity: 0.9;
      pointer-events: none;
    }

    /* Puntos sobre el plano */
    .plano-punto {
      position: absolute;
      transform: translate(-50%, -50%);
      pointer-events: none;
    }
    .plano-punto .punto-dot {
      width: 12px; height: 12px;
      border-radius: 50%;
      background: var(--gold);
      border: 2px solid #080808;
      box-shadow: 0 0 6px rgba(200,169,110,0.6);
    }
    .plano-punto.inactive .punto-dot {
      background: rgba(200,169,110,0.35);
      box-shadow: none;
    }
    .plano-punto .punto-label {
      position: absolute;
      top: 14px; left: 50%;
      transform: translateX(-50%);
      font-size: 9px; letter-spacing: 1.5px; text-transform: uppercase;
      color: var(--gold); white-space: nowrap;
      text-shadow: 0 0 6px #080808, 0 0 3px #080808;
    }
    .plano-punto.inactive .punto-label { color: rgba(200,169,110,0.4); }

    /* Cono de visión SVG */
    #cono-svg {
      position: absolute;
      inset: 0;
      pointer-events: none;
      overflow: visible;
    }

    /* Crosshair de cursor */
    #cursor-cross {
      position: absolute;
      pointer-events: none;
      display: none;
    }
    #cursor-cross::before, #cursor-cross::after {
      content:''; position:absolute; background: rgba(200,169,110,0.6);
    }
    #cursor-cross::before { width:1px; height:16px; top:-8px; left:0; }
    #cursor-cross::after  { width:16px; height:1px; left:-8px; top:0; }

    /* ── PANEL DERECHO ── */
    #panel {
      width: 320px; flex-shrink: 0;
      background: var(--panel);
      border-left: 1px solid var(--border);
      display: flex; flex-direction: column; overflow: hidden;
    }
    #panel-header {
      padding: 14px 16px;
      border-bottom: 1px solid var(--border);
      font-size: 9px; letter-spacing: 3px;
      text-transform: uppercase; color: var(--gold);
    }
    #scene-list {
      flex: 1; overflow-y: auto; padding: 10px;
      display: flex; flex-direction: column; gap: 8px;
    }
    #scene-list::-webkit-scrollbar { width:4px; }
    #scene-list::-webkit-scrollbar-thumb { background:var(--border); border-radius:2px; }

    .sc-card {
      background: rgba(255,255,255,0.03);
      border: 1px solid rgba(255,255,255,0.06);
      border-radius: 3px; padding: 12px;
      transition: all 0.2s;
    }
    .sc-card.active { border-color: var(--gold); background: rgba(200,169,110,0.06); }
    .sc-card.no-pos { border-color: rgba(224,112,112,0.2); }
    .sc-card-label {
      font-size: 13px; font-weight: 300; margin-bottom: 10px;
      display: flex; align-items: center; justify-content: space-between;
    }
    .sc-badge {
      font-size: 8px; letter-spacing: 1.5px; text-transform: uppercase;
      padding: 2px 7px; border-radius: 2px;
    }
    .sc-badge.ok  { color: #8bc88b; border: 1px solid rgba(139,200,139,0.3); background: rgba(139,200,139,0.06); }
    .sc-badge.sin { color: rgba(224,112,112,0.8); border: 1px solid rgba(224,112,112,0.2); background: rgba(224,112,112,0.05); }

    .sc-fields { display:flex; flex-direction:column; gap:8px; }
    .sc-row { display:flex; gap:8px; }
    .sc-field { flex:1; display:flex; flex-direction:column; gap:3px; }
    .sc-field label {
      font-size: 8px; letter-spacing: 2px; text-transform: uppercase; color: var(--text-dim);
    }
    .sc-field input {
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.08); border-radius: 2px;
      color: var(--text); font-family:'Outfit',sans-serif;
      font-size: 13px; padding: 5px 8px; width: 100%; outline: none;
      transition: border-color 0.2s;
    }
    .sc-field input:focus { border-color: var(--gold); }

    /* Norte — slider + número */
    .norte-wrap { display:flex; gap:8px; align-items:center; }
    .norte-wrap input[type=range] {
      flex: 1; accent-color: var(--gold);
      height: 2px; cursor: pointer;
    }
    .norte-num {
      width: 52px; text-align: right;
      font-size: 13px; color: var(--text);
      font-family:'Outfit',sans-serif;
    }

    .sc-actions { display:flex; gap:6px; margin-top:10px; }
    .sc-action {
      flex:1; background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.08); border-radius: 2px;
      color: var(--text-dim); font-family:'Outfit',sans-serif;
      font-size: 9px; letter-spacing: 1.5px; text-transform: uppercase;
      padding: 5px 0; cursor: pointer; transition: all 0.2s; text-align:center;
    }
    .sc-action:hover { color:var(--text); border-color:var(--border); }
    .sc-action.primary { color:var(--gold); border-color:var(--border); }
    .sc-action.primary:hover { background:rgba(200,169,110,0.1); border-color:var(--gold); }
    .sc-action.danger { color:#e07070; border-color:rgba(224,112,112,0.2); }
    .sc-action.danger:hover { background:rgba(224,112,112,0.08); border-color:#e07070; }

    /* ── OUTPUT ── */
    #output-section {
      border-top: 1px solid var(--border);
      padding: 12px; flex-shrink: 0;
    }
    #output-label {
      font-size: 8px; letter-spacing: 2.5px; text-transform: uppercase;
      color: var(--text-dim); margin-bottom: 8px;
    }
    #output-box {
      background: rgba(0,0,0,0.4); border: 1px solid var(--border);
      border-radius: 2px; padding: 10px;
      font-family:'Courier New',monospace; font-size: 10px;
      line-height: 1.6; color: #a8d8a8; white-space: pre;
      overflow-x: auto; max-height: 130px; overflow-y: auto;
    }
    #output-box::-webkit-scrollbar { width:3px; height:3px; }
    #output-box::-webkit-scrollbar-thumb { background:var(--border); }
    #copy-btn {
      margin-top: 8px; width: 100%;
      background: rgba(200,169,110,0.1); border: 1px solid var(--border);
      border-radius: 2px; color: var(--gold); font-family:'Outfit',sans-serif;
      font-size: 10px; letter-spacing: 2px; text-transform: uppercase;
      padding: 7px; cursor: pointer; transition: all 0.2s;
    }
    #copy-btn:hover { background: rgba(200,169,110,0.18); border-color: var(--gold); }
    #copy-btn.copied { color:#8bc88b; border-color:rgba(139,200,139,0.4); }

    /* Toast */
    #toast {
      position: fixed; bottom: 24px; left: 50%;
      transform: translateX(-50%) translateY(20px);
      background: rgba(200,169,110,0.15); border:1px solid rgba(200,169,110,0.4);
      border-radius: 3px; padding: 8px 20px;
      font-size: 11px; letter-spacing: 2px; text-transform: uppercase;
      color: var(--gold); opacity: 0;
      transition: opacity 0.3s, transform 0.3s;
      pointer-events: none; z-index: 9999; white-space: nowrap;
    }
    #toast.show { opacity:1; transform:translateX(-50%) translateY(0); }
  </style>
</head>
<body>

<!-- TOOLBAR -->
<div id="toolbar">
  <h1>CALIBRADOR MINIMAP · CASA MARTÍNEZ</h1>
  <div class="tb-sep"></div>
  <select id="scene-select" onchange="seleccionarEscena(this.value)">
    <option value="">— Seleccionar escena —</option>
    <option value="living">Living / Comedor</option>
    <option value="cocina">Cocina</option>
    <option value="dormitorio">Dormitorio</option>
    <option value="bano">Baño Suite</option>
    <option value="jardin">Jardín</option>
  </select>
  <div class="tb-sep"></div>
  <button class="tb-btn" onclick="generarCodigo()">{ } Generar código</button>
  <div id="tb-instruccion"><strong>Click en el plano</strong> para posicionar la escena seleccionada</div>
</div>

<!-- MAIN -->
<div id="main">

  <!-- PLANO -->
  <div id="plano-wrap">
    <div id="plano-inner">
      <img id="plano-img" src="images/plano-martinez-blanco.png" alt="Planta"/>
      <svg id="cono-svg"></svg>
      <div id="cursor-cross"></div>
    </div>
  </div>

  <!-- PANEL -->
  <div id="panel">
    <div id="panel-header">Posiciones por escena</div>
    <div id="scene-list"></div>
    <div id="output-section">
      <div id="output-label">Código generado</div>
      <div id="output-box">// Ajustá las posiciones y presioná "Generar código"</div>
      <button id="copy-btn" onclick="copiarCodigo()">Copiar código</button>
    </div>
  </div>

</div>

<div id="toast"></div>

<script>
// ═══════════════════════════════════════════════════
// DATOS — sincronizados con index.html
// ═══════════════════════════════════════════════════
const PLANO_W = 3030, PLANO_H = 1052;

// Escenas con o sin posición en minimap
const ESCENAS_INFO = [
  { id: "living",     label: "Living / Comedor" },
  { id: "cocina",     label: "Cocina"           },
  { id: "dormitorio", label: "Dormitorio"       },
  { id: "bano",       label: "Baño Suite"       },
  { id: "jardin",     label: "Jardín"           }
];

// Posiciones actuales en px (sobre PLANO_W × PLANO_H)
// null = sin posición definida aún
let datos = {
  "living":     { px: 1600, py: 600,  norte: 329 },
  "cocina":     { px: 1260, py: 730,  norte: 249 },
  "dormitorio": null,
  "bano":       null,
  "jardin":     { px: 2290, py: 540,  norte: 249 }
};

// ═══════════════════════════════════════════════════
// ESTADO
// ═══════════════════════════════════════════════════
let escenaSeleccionada = null;
let imgW = 0, imgH = 0; // tamaño rendered del img en pantalla
let norteRAF = null;

// ═══════════════════════════════════════════════════
// INIT
// ═══════════════════════════════════════════════════
const planoImg  = document.getElementById('plano-img');
const planoInner = document.getElementById('plano-inner');
const conoSvg   = document.getElementById('cono-svg');
const cursorCross = document.getElementById('cursor-cross');

planoImg.onload = () => { actualizarDimensiones(); renderizarTodo(); };
if (planoImg.complete) { actualizarDimensiones(); renderizarTodo(); }

window.addEventListener('resize', () => { actualizarDimensiones(); renderizarTodo(); });

function actualizarDimensiones() {
  imgW = planoImg.offsetWidth;
  imgH = planoImg.offsetHeight;
}

// Click en el plano → posicionar escena seleccionada
planoInner.addEventListener('click', e => {
  if (!escenaSeleccionada) {
    mostrarToast('Seleccioná una escena primero');
    return;
  }
  const rect = planoImg.getBoundingClientRect();
  const rx = (e.clientX - rect.left) / imgW;
  const ry = (e.clientY - rect.top)  / imgH;
  const px = Math.round(rx * PLANO_W);
  const py = Math.round(ry * PLANO_H);

  if (!datos[escenaSeleccionada]) {
    datos[escenaSeleccionada] = { px, py, norte: 0 };
  } else {
    datos[escenaSeleccionada].px = px;
    datos[escenaSeleccionada].py = py;
  }

  sincronizarInputs(escenaSeleccionada);
  renderizarTodo();
  mostrarToast(`${escenaSeleccionada} → px:${px} py:${py}`);
});

// Cursor crosshair
planoInner.addEventListener('mousemove', e => {
  const rect = planoImg.getBoundingClientRect();
  const x = e.clientX - rect.left;
  const y = e.clientY - rect.top;
  cursorCross.style.display = 'block';
  cursorCross.style.left = x + 'px';
  cursorCross.style.top  = y + 'px';
});
planoInner.addEventListener('mouseleave', () => {
  cursorCross.style.display = 'none';
});

// ═══════════════════════════════════════════════════
// RENDER PLANO
// ═══════════════════════════════════════════════════
function renderizarTodo() {
  actualizarDimensiones();
  // Limpiar puntos anteriores
  document.querySelectorAll('.plano-punto').forEach(e => e.remove());
  conoSvg.innerHTML = '';

  Object.entries(datos).forEach(([id, pos]) => {
    if (!pos) return;
    const info = ESCENAS_INFO.find(e => e.id === id);
    const rx = pos.px / PLANO_W;
    const ry = pos.py / PLANO_H;
    const sx = rx * imgW;
    const sy = ry * imgH;
    const activo = id === escenaSeleccionada;

    // Punto
    const punto = document.createElement('div');
    punto.className = 'plano-punto' + (activo ? ' active' : ' inactive');
    punto.style.left = sx + 'px';
    punto.style.top  = sy + 'px';
    punto.innerHTML = `<div class="punto-dot"></div><div class="punto-label">${info ? info.label : id}</div>`;
    planoInner.appendChild(punto);

    // Cono solo para escena activa
    if (activo) {
      dibujarCono(sx, sy, pos.norte);
    }
  });
}

function dibujarCono(cx, cy, norte) {
  // Cono: arco de 75° centrado en el ángulo norte
  const R = Math.min(imgW, imgH) * 0.12;
  const angRad = (norte - 90) * Math.PI / 180;
  const spread = 37.5 * Math.PI / 180;
  const a1 = angRad - spread;
  const a2 = angRad + spread;
  const x1 = cx + R * Math.cos(a1);
  const y1 = cy + R * Math.sin(a1);
  const x2 = cx + R * Math.cos(a2);
  const y2 = cy + R * Math.sin(a2);

  // Gradiente
  const gradId = 'cone-grad';
  const defs = document.createElementNS('http://www.w3.org/2000/svg','defs');
  defs.innerHTML = `
    <radialGradient id="${gradId}" cx="50%" cy="100%" r="80%">
      <stop offset="0%" stop-color="#c8a96e" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#c8a96e" stop-opacity="0"/>
    </radialGradient>`;
  conoSvg.appendChild(defs);

  // Sector
  const path = document.createElementNS('http://www.w3.org/2000/svg','path');
  path.setAttribute('d', `M ${cx} ${cy} L ${x1} ${y1} A ${R} ${R} 0 0 1 ${x2} ${y2} Z`);
  path.setAttribute('fill', `url(#${gradId})`);
  path.setAttribute('stroke', 'rgba(200,169,110,0.7)');
  path.setAttribute('stroke-width', '0.8');
  conoSvg.appendChild(path);

  // Punto central
  const circle = document.createElementNS('http://www.w3.org/2000/svg','circle');
  circle.setAttribute('cx', cx); circle.setAttribute('cy', cy); circle.setAttribute('r', 5);
  circle.setAttribute('fill', '#c8a96e');
  circle.setAttribute('stroke', '#080808'); circle.setAttribute('stroke-width', '1.5');
  conoSvg.appendChild(circle);
}

// ═══════════════════════════════════════════════════
// PANEL
// ═══════════════════════════════════════════════════
function renderizarPanel() {
  const lista = document.getElementById('scene-list');
  lista.innerHTML = '';

  ESCENAS_INFO.forEach(info => {
    const pos = datos[info.id];
    const card = document.createElement('div');
    card.className = 'sc-card' + (info.id === escenaSeleccionada ? ' active' : '') + (!pos ? ' no-pos' : '');
    card.id = 'card-' + info.id;

    const badgeClass = pos ? 'ok' : 'sin';
    const badgeText  = pos ? 'Calibrado' : 'Sin posición';

    card.innerHTML = `
      <div class="sc-card-label">
        ${info.label}
        <span class="sc-badge ${badgeClass}">${badgeText}</span>
      </div>
      <div class="sc-fields">
        <div class="sc-row">
          <div class="sc-field">
            <label>Px (X)</label>
            <input type="number" id="px-${info.id}" value="${pos ? pos.px : ''}" placeholder="—"
              onchange="actualizarCampo('${info.id}','px',this.value)">
          </div>
          <div class="sc-field">
            <label>Py (Y)</label>
            <input type="number" id="py-${info.id}" value="${pos ? pos.py : ''}" placeholder="—"
              onchange="actualizarCampo('${info.id}','py',this.value)">
          </div>
        </div>
        <div class="sc-field">
          <label>Norte (ángulo de visión)</label>
          <div class="norte-wrap">
            <input type="range" min="0" max="359" step="1"
              id="norte-range-${info.id}"
              value="${pos ? pos.norte : 0}"
              oninput="actualizarNorte('${info.id}', this.value)">
            <span class="norte-num" id="norte-num-${info.id}">${pos ? pos.norte : 0}°</span>
          </div>
        </div>
      </div>
      <div class="sc-actions">
        <button class="sc-action primary" onclick="seleccionarEscenaCard('${info.id}')">◎ Seleccionar</button>
        ${pos ? `<button class="sc-action danger" onclick="eliminarPosicion('${info.id}')">✕ Quitar</button>` : ''}
      </div>
    `;
    lista.appendChild(card);
  });
}

function seleccionarEscena(id) {
  escenaSeleccionada = id || null;
  document.getElementById('scene-select').value = id || '';
  renderizarPanel();
  renderizarTodo();
}

function seleccionarEscenaCard(id) {
  seleccionarEscena(id);
  mostrarToast(`Hacé click en el plano para posicionar "${id}"`);
}

function actualizarCampo(id, campo, valor) {
  const v = parseInt(valor);
  if (isNaN(v)) return;
  if (!datos[id]) datos[id] = { px: 0, py: 0, norte: 0 };
  datos[id][campo] = v;
  renderizarTodo();
  actualizarBadge(id);
}

function actualizarNorte(id, valor) {
  const v = parseInt(valor);
  if (!datos[id]) datos[id] = { px: 0, py: 0, norte: v };
  else datos[id].norte = v;
  document.getElementById('norte-num-' + id).textContent = v + '°';
  renderizarTodo();
}

function sincronizarInputs(id) {
  const pos = datos[id];
  if (!pos) return;
  const pxEl = document.getElementById('px-' + id);
  const pyEl = document.getElementById('py-' + id);
  const nrEl = document.getElementById('norte-range-' + id);
  const nnEl = document.getElementById('norte-num-' + id);
  if (pxEl) pxEl.value = pos.px;
  if (pyEl) pyEl.value = pos.py;
  if (nrEl) nrEl.value = pos.norte;
  if (nnEl) nnEl.textContent = pos.norte + '°';
  actualizarBadge(id);
}

function actualizarBadge(id) {
  const card = document.getElementById('card-' + id);
  if (!card) return;
  const pos = datos[id];
  const badge = card.querySelector('.sc-badge');
  if (badge) {
    badge.className = 'sc-badge ' + (pos ? 'ok' : 'sin');
    badge.textContent = pos ? 'Calibrado' : 'Sin posición';
  }
  card.classList.toggle('no-pos', !pos);
}

function eliminarPosicion(id) {
  datos[id] = null;
  renderizarPanel();
  renderizarTodo();
  mostrarToast(`Posición de "${id}" eliminada`);
}

// ═══════════════════════════════════════════════════
// GENERADOR DE CÓDIGO
// ═══════════════════════════════════════════════════
function generarCodigo() {
  let out = `const PLANO_W = ${PLANO_W}, PLANO_H = ${PLANO_H};\n`;
  out += `function _pct(px, py, norte) { return { x: (px / PLANO_W) * 100, y: (py / PLANO_H) * 100, norte: norte }; }\n\n`;
  out += `const MINIMAP_POS = {\n`;

  const lineas = [];
  ESCENAS_INFO.forEach(info => {
    const pos = datos[info.id];
    if (pos) {
      lineas.push(`  "${info.id}": _pct(${pos.px}, ${pos.py}, ${pos.norte})`);
    }
  });
  out += lineas.join(',\n') + '\n';
  out += `};`;

  document.getElementById('output-box').textContent = out;
  document.getElementById('copy-btn').classList.remove('copied');
  document.getElementById('copy-btn').textContent = 'Copiar código';
  mostrarToast('Código generado');
}

function copiarCodigo() {
  const texto = document.getElementById('output-box').textContent;
  if (texto.startsWith('//')) return;
  navigator.clipboard.writeText(texto).then(() => {
    const btn = document.getElementById('copy-btn');
    btn.textContent = '✓ Copiado';
    btn.classList.add('copied');
    setTimeout(() => { btn.textContent = 'Copiar código'; btn.classList.remove('copied'); }, 2000);
    mostrarToast('Código copiado al portapapeles');
  });
}

// ═══════════════════════════════════════════════════
// UTILS
// ═══════════════════════════════════════════════════
function mostrarToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2400);
}

// ── INIT ──
renderizarPanel();
</script>
