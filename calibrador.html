<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calibrador de Hotspots — Casa Martínez</title>
  <script src="https://cdn.jsdelivr.net/npm/pannellum@2.5.7/build/pannellum.js" crossorigin="anonymous"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pannellum@2.5.7/build/pannellum.css" crossorigin="anonymous"/>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400&family=Outfit:wght@200;300;400&display=swap" rel="stylesheet">
  <style>
    :root {
      --gold: #c8a96e;
      --bg: #080808;
      --text: #f0ece4;
      --text-dim: rgba(240,236,228,0.5);
      --border: rgba(200,169,110,0.25);
      --panel: rgba(10,10,10,0.97);
    }
    * { margin:0; padding:0; box-sizing:border-box; }
    body { font-family:'Outfit',sans-serif; background:var(--bg); color:var(--text); height:100vh; overflow:hidden; display:flex; flex-direction:column; }

    #toolbar {
      position: relative;
      z-index: 300;
      background: rgba(8,8,8,0.98);
      border-bottom: 1px solid var(--border);
      padding: 10px 20px;
      display: flex;
      align-items: center;
      gap: 16px;
      flex-wrap: wrap;
      flex-shrink: 0;
    }
    #toolbar h1 {
      font-family:'Cormorant Garamond',serif;
      font-size: 18px;
      font-weight: 300;
      letter-spacing: 3px;
      color: var(--gold);
      white-space: nowrap;
    }
    .tb-sep { width:1px; height:28px; background:var(--border); flex-shrink:0; }
    #scene-select {
      background: rgba(255,255,255,0.04);
      border: 1px solid var(--border);
      border-radius: 3px;
      color: var(--text);
      font-family:'Outfit',sans-serif;
      font-size: 12px;
      letter-spacing: 1px;
      padding: 6px 12px;
      cursor: pointer;
      outline: none;
    }
    #scene-select option { background: #111; }
    .tb-btn {
      background: rgba(200,169,110,0.08);
      border: 1px solid var(--border);
      border-radius: 3px;
      color: var(--gold);
      font-family:'Outfit',sans-serif;
      font-size: 11px;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      padding: 6px 14px;
      cursor: pointer;
      transition: all 0.2s;
      white-space: nowrap;
    }
    .tb-btn:hover { background: rgba(200,169,110,0.16); border-color: var(--gold); }
    #coords-live {
      font-size: 12px;
      letter-spacing: 1px;
      color: var(--text-dim);
      margin-left: auto;
      white-space: nowrap;
    }
    #coords-live span { color: var(--gold); font-weight: 400; }

    #main { display:flex; flex:1; overflow:hidden; }
    #viewer-wrap { flex:1; position:relative; }
    #panorama { width:100%; height:100%; }
    .pnlm-controls-container { display:none !important; }
    .pnlm-about-msg { display:none !important; }

    #crosshair {
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      pointer-events: none;
      z-index: 10;
    }
    #crosshair::before, #crosshair::after {
      content: '';
      position: absolute;
      background: rgba(200,169,110,0.6);
    }
    #crosshair::before { width: 20px; height: 1px; top: 0; left: -10px; }
    #crosshair::after { width: 1px; height: 20px; left: 0; top: -10px; }

    #sidebar {
      width: 320px;
      background: var(--panel);
      border-left: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    #hotspot-list {
      flex: 1;
      overflow-y: auto;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .hs-card {
      background: rgba(255,255,255,0.03);
      border: 1px solid rgba(255,255,255,0.06);
      border-radius: 3px;
      padding: 10px 12px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .hs-card:hover { border-color: var(--border); background: rgba(200,169,110,0.05); }
    .hs-card.active { border-color: var(--gold); background: rgba(200,169,110,0.08); }
    .hs-card-type {
      font-size: 8px;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: var(--text-dim);
      margin-bottom: 4px;
    }
    .hs-card-type.nav { color: #7eb8c8; }
    .hs-card-label {
      font-size: 13px;
      font-weight: 300;
      color: var(--text);
      margin-bottom: 8px;
    }
    .hs-coords {
      display: flex;
      gap: 8px;
    }
    .hs-coord-field {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 3px;
    }
    .hs-coord-field label {
      font-size: 8px;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: var(--text-dim);
    }
    .hs-coord-field input {
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 2px;
      color: var(--text);
      font-family:'Outfit',sans-serif;
      font-size: 13px;
      padding: 5px 8px;
      width: 100%;
      outline: none;
      transition: border-color 0.2s;
    }
    .hs-coord-field input:focus { border-color: var(--gold); }
    .hs-card-actions {
      display: flex;
      gap: 6px;
      margin-top: 8px;
    }
    .hs-action {
      flex: 1;
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 2px;
      color: var(--text-dim);
      font-family:'Outfit',sans-serif;
      font-size: 9px;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      padding: 5px 0;
      cursor: pointer;
      transition: all 0.2s;
      text-align: center;
    }
    .hs-action:hover { color: var(--text); border-color: var(--border); }
    .hs-action.primary { color: var(--gold); border-color: var(--border); }
    .hs-action.primary:hover { background: rgba(200,169,110,0.1); border-color: var(--gold); }

    #output-section {
      border-top: 1px solid var(--border);
      padding: 12px;
      flex-shrink: 0;
    }
    #output-label {
      font-size: 8px;
      letter-spacing: 2.5px;
      text-transform: uppercase;
      color: var(--text-dim);
      margin-bottom: 8px;
    }
    #output-box {
      background: rgba(0,0,0,0.5);
      border: 1px solid var(--border);
      border-radius: 2px;
      padding: 8px;
      font-family:'Courier New',monospace;
      font-size: 9px;
      line-height: 1.5;
      color: #a8d8a8;
      white-space: pre;
      overflow: auto;
      max-height: 120px;
      margin-bottom: 8px;
    }
    #copy-btn {
      width: 100%;
      background: rgba(200,169,110,0.08);
      border: 1px solid var(--border);
      border-radius: 2px;
      color: var(--gold);
      font-family:'Outfit',sans-serif;
      font-size: 9px;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      padding: 6px;
      cursor: pointer;
      transition: all 0.2s;
    }
    #copy-btn:hover { background: rgba(200,169,110,0.15); border-color: var(--gold); }
  </style>
</head>
<body>

<div id="toolbar">
  <h1>Calibrador Hotspots</h1>
  <div class="tb-sep"></div>
  <select id="scene-select" onchange="cambiarEscena(this.value)"></select>
  <button class="tb-btn" onclick="generarCodigo()">⊕ Generar código</button>
  <div id="coords-live">Pitch: <span id="live-pitch">0.0</span>° | Yaw: <span id="live-yaw">0.0</span>°</div>
</div>

<div id="main">
  <div id="viewer-wrap">
    <div id="panorama"></div>
    <div id="crosshair"></div>
  </div>
  <div id="sidebar">
    <div id="hotspot-list"></div>
    <div id="output-section">
      <div id="output-label">Código generado</div>
      <div id="output-box">// Click en "Generar código"</div>
      <button id="copy-btn" onclick="copiarCodigo()">Copiar</button>
    </div>
  </div>
</div>

<script>
const ESCENAS = [
  { id:"living",    label:"Living / Comedor", img:"images/living.jpg",    pitch:-5, yaw:0 },
  { id:"cocina",    label:"Cocina",           img:"images/cocina.jpg",    pitch:-5, yaw:0 },
  { id:"hall",      label:"Hall",             img:"images/hall.jpg",      pitch:-5, yaw:0 },
  { id:"dormitorio", label:"Dormitorio",      img:"images/dormitorio.jpg", pitch:-5, yaw:0 },
  { id:"bano",      label:"Baño Suite",       img:"images/bano.jpg",      pitch:-5, yaw:0 },
  { id:"lavadero",  label:"Lavadero",         img:"images/lavadero.jpg",  pitch:-5, yaw:0 },
  { id:"jardin",    label:"Jardín",           img:"images/jardin.jpg",    pitch:0,  yaw:0 }
];

let visor = null;
let escenaActual = null;
let datosEscenas = {};

ESCENAS.forEach(e => {
  datosEscenas[e.id] = {
    ...e,
    hotspots: [
      { targetScene: "living", pitch: 0, yaw: 0, text: "Nuevo hotspot" }
    ]
  };
});

function cambiarEscena(id) {
  escenaActual = id;
  const esc = datosEscenas[id];
  if (visor) { try { visor.destroy(); } catch(e){} visor = null; }
  visor = pannellum.viewer('panorama', {
    type: 'equirectangular',
    panorama: esc.img,
    autoLoad: true,
    autoRotate: 0,
    compass: false,
    showFullscreenCtrl: false,
    showZoomCtrl: false,
    pitch: esc.pitch,
    yaw: esc.yaw,
    hfov: 100,
    strings: { loadingLabel:"", bylineLabel:"" }
  });

  setInterval(() => {
    if (!visor) return;
    try {
      document.getElementById('live-pitch').textContent = visor.getPitch().toFixed(1);
      document.getElementById('live-yaw').textContent = visor.getYaw().toFixed(1);
    } catch(e){}
  }, 100);

  renderHotspots();
}

function renderHotspots() {
  const list = document.getElementById('hotspot-list');
  const esc = datosEscenas[escenaActual];
  list.innerHTML = '';
  
  if (!esc.hotspots) esc.hotspots = [];
  
  esc.hotspots.forEach((hs, idx) => {
    const card = document.createElement('div');
    card.className = 'hs-card';
    card.innerHTML = `
      <div class="hs-card-type nav">${hs.targetScene || '—'}</div>
      <div class="hs-card-label">${hs.text}</div>
      <div class="hs-coords">
        <div class="hs-coord-field">
          <label>Pitch</label>
          <input type="number" step="0.1" value="${hs.pitch.toFixed(1)}" 
            onchange="editHS(${idx}, 'pitch', this.value)">
        </div>
        <div class="hs-coord-field">
          <label>Yaw</label>
          <input type="number" step="0.1" value="${hs.yaw.toFixed(1)}" 
            onchange="editHS(${idx}, 'yaw', this.value)">
        </div>
      </div>
      <div class="hs-card-actions">
        <button class="hs-action primary" onclick="capturarDesdeVisor(${idx})">⊕ Capturar</button>
        <button class="hs-action" onclick="borrarHS(${idx})">✕ Borrar</button>
      </div>
    `;
    list.appendChild(card);
  });

  const addBtn = document.createElement('div');
  addBtn.style.cssText = 'padding: 10px; text-align: center; border-top: 1px solid var(--border); margin-top: auto;';
  addBtn.innerHTML = '<button class="tb-btn" onclick="agregarHS()" style="width:100%;">+ Nuevo hotspot</button>';
  list.appendChild(addBtn);
}

function editHS(idx, campo, val) {
  const esc = datosEscenas[escenaActual];
  esc.hotspots[idx][campo] = parseFloat(val);
}

function capturarDesdeVisor(idx) {
  if (!visor) return;
  const pitch = visor.getPitch();
  const yaw = visor.getYaw();
  datosEscenas[escenaActual].hotspots[idx].pitch = parseFloat(pitch.toFixed(1));
  datosEscenas[escenaActual].hotspots[idx].yaw = parseFloat(yaw.toFixed(1));
  renderHotspots();
}

function agregarHS() {
  const esc = datosEscenas[escenaActual];
  esc.hotspots.push({ targetScene: "living", pitch: 0, yaw: 0, text: "Nuevo hotspot" });
  renderHotspots();
}

function borrarHS(idx) {
  datosEscenas[escenaActual].hotspots.splice(idx, 1);
  renderHotspots();
}

function generarCodigo() {
  const esc = datosEscenas[escenaActual];
  let out = `// ${esc.label}\n`;
  out += `hotspots: [\n`;
  esc.hotspots.forEach(hs => {
    out += `  { targetScene: "${hs.targetScene}", pitch: ${hs.pitch}, yaw: ${hs.yaw}, text: "${hs.text}" },\n`;
  });
  out += `]`;
  document.getElementById('output-box').textContent = out;
}

function copiarCodigo() {
  const txt = document.getElementById('output-box').textContent;
  navigator.clipboard.writeText(txt).then(() => {
    const btn = document.getElementById('copy-btn');
    btn.textContent = '✓ Copiado';
    setTimeout(() => btn.textContent = 'Copiar', 2000);
  });
}

// Init
const sel = document.getElementById('scene-select');
ESCENAS.forEach(e => {
  const opt = document.createElement('option');
  opt.value = e.id;
  opt.textContent = e.label;
  sel.appendChild(opt);
});
cambiarEscena('living');
</script>

</body>
</html>
